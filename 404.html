<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Erro 404</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 6rem;
            color: #1d1d1d; /* Cor de erro/alerta, adapte para sua marca */
            margin-bottom: 10px;
            line-height: 1;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 30px;
            color: #666;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            background-color: #292929;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            h1 { font-size: 4rem; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>404</h1>
        <h2>Página não encontrada</h2>
        <p>
            O link que você seguiu pode estar quebrado ou a página foi removida.
            Não se preocupe, você ainda pode encontrar o que precisa.
        </p>
        
        <a href="/kaua/" class="btn">Voltar para a Home</a>
    </div>

</body>
</html>
